
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
    id 'maven-publish'
    id 'signing'
    id 'com.gradleup.nmcp' version '0.0.8'
    id 'jacoco'
}

android {
    namespace 'com.mte.relay'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "4.4.0"
        setProperty("archivesBaseName", "eclypses-aws-mte-relay-client-android-release-$versionName")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all {
                useJUnitPlatform()
            }
        }
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'com.github.tony19:logback-android:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.24'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}

jacoco {
    toolVersion = '0.8.12'
}

def coverageExclusions = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/*$Companion*.*',
        '**/*$Lambda$*.*',
        '**/*$inlined$*.*'
]

def minLineCoverage = (project.findProperty('minLineCoverage') ?: '0.40').toBigDecimal()

tasks.register('jacocoUnitTestReport', JacocoReport) {
    dependsOn tasks.named('testDebugUnitTest')

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def javaDebugTree = fileTree(dir: "$buildDir/intermediates/javac/debug/classes", excludes: coverageExclusions)
    def kotlinDebugTree = fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", excludes: coverageExclusions)
    classDirectories.setFrom(files([javaDebugTree, kotlinDebugTree]))

    sourceDirectories.setFrom(files([
            "$projectDir/src/main/java",
            "$projectDir/src/main/kotlin"
    ]))

    executionData.setFrom(files([
            "$buildDir/jacoco/testDebugUnitTest.exec",
            "$buildDir/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"
    ]))
}

tasks.register('jacocoUnitTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoUnitTestReport')

    def javaDebugTree = fileTree(dir: "$buildDir/intermediates/javac/debug/classes", excludes: coverageExclusions)
    def kotlinDebugTree = fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", excludes: coverageExclusions)
    classDirectories.setFrom(files([javaDebugTree, kotlinDebugTree]))
    sourceDirectories.setFrom(files([
            "$projectDir/src/main/java",
            "$projectDir/src/main/kotlin"
    ]))
    executionData.setFrom(files([
            "$buildDir/jacoco/testDebugUnitTest.exec",
            "$buildDir/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"
    ]))

    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = minLineCoverage
            }
        }
    }
}

publishing {
    publications {
        release(MavenPublication) {

            groupId = 'com.eclypses'
            artifactId = 'eclypses-aws-mte-relay-client-android-release'
            version = '4.4.0'

            afterEvaluate {
                artifact("$buildDir/outputs/aar/${artifactId}-${version}-release.aar")
            }

            pom {
                name = 'Eclypses AWS MteRelay Android Client Library'
                description = 'MteRelay: Android Library for Eclypses MteRelay'
                url = 'https://github.com/Eclypses/eclypses-aws-mte-relay-client-android.git'
                inceptionYear = '2024'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'GregWaggoner'
                        name = 'Greg Waggoner'
                        email = 'greg.waggoner@eclypses.com'
                    }
                }
                scm {
                    connection = 'scm:git@github.com:Eclypses/eclypses-aws-mte-relay-client-android'
                    developerConnection = 'scm:git@github.com:Eclypses/eclypses-aws-mte-relay-client-android.git'
                    url = 'https://github.com/Eclypses/eclypses-aws-mte-relay-client-android.git'
                }
            }
            repositories {
                maven {
                    name = 'MavenCentral'
                    url = 'https://central.sonatype.com/api/v1/publisher'

                    credentials {
                        username = project.findProperty("ossrhUsername") ?: ""
                        password = project.findProperty("ossrhPassword") ?: ""
                    }
                }

            }

        }
    }
}

signing {
    useGpgCmd()
    sign publishing.publications.release
}

